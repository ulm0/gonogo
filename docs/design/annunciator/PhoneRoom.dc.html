<div style="flex-grow: 1"></div>

<section aria-label="The wall" style="padding: 6px 14px 12px; display: flex; flex-direction: column; gap: 6px; border-top: 1.5px solid #2B2C30">

<button type="button" style="appearance: none; cursor: pointer; text-align: left; min-width: 0; height: 62px; box-sizing: border-box; padding: 7px 8px; border: {{t.border}}; border-radius: 0; background: {{t.bg}}; color: {{t.fg}}; display: flex; flex-direction: column; justify-content: space-between; font-family: 'IBM Plex Mono', ui-monospace, monospace">

</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var K = '#060606', W = '#F3F1EA', A = '#FFB020', M = '#A3A19A', D = '#85847E';
    var KIND = {
      idle: { bg: '#17181B', fg: W, sub: M, border: '1.5px solid #17181B' },
      working: { bg: W, fg: K, sub: '#3A3A38', border: '1.5px solid ' + W },
      needs: { bg: A, fg: K, sub: '#3D2A00', border: '1.5px solid ' + A },
      stopped: { bg: 'repeating-linear-gradient(135deg, #17181B 0 6px, #0C0C0E 6px 12px)', fg: M, sub: M, border: '1.5px solid #2B2C30' },
      open: { bg: 'transparent', fg: D, sub: D, border: '1.5px dashed #45464B' }
    };
    function tile(kind, legend, state, l1) {
      var k = KIND[kind];
      return { legend: legend, state: state, l1: l1 || '', bg: k.bg, fg: k.fg, sub: k.sub, border: k.border };
    }
    var tiles = [
      tile('idle', 'FLIGHT', 'IDLE 2 M', 'Polled the room.'),
      tile('idle', 'FAO', 'IDLE · GO', 'Plan v2 sent.'),
      tile('open', 'FIDO', 'OPEN'),
      tile('working', 'GUIDO', 'WORKING · GO', 'Writing the route…'),
      tile('working', 'CONTROL', 'WORKING 1 M', 'ExportButton.tsx'),
      tile('open', 'DPS', 'OPEN'),
      tile('open', 'INCO', 'OPEN'),
      tile('open', 'EECOM', 'OPEN'),
      tile('open', 'BOOSTER', 'OPEN'),
      tile('needs', 'SURGEON', 'NEEDS YOU 3 M', 'npm run test:e2e'),
      tile('open', 'SIMSUP', 'OPEN'),
      tile('open', 'RETRO', 'OPEN'),
      tile('idle', 'RSO', 'IDLE · GO', 'No findings.'),
      tile('stopped', 'PAO', 'STOPPED 21 M'),
      tile('open', 'CAPCOM', 'OPEN'),
      tile('working', 'LOGS', 'PRINTING', 'tail -f logs/app.log'),
      tile('open', 'SPARE', 'OPEN')
    ];
    return { tiles: tiles };
  }
}
</script>
