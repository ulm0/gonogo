<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gonogo: staff a console</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700;900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Michroma&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F3F1EA}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="min-height: 960px; box-sizing: border-box; padding: 28px 40px 36px; background: #060606; color: #F3F1EA; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; display: flex; flex-direction: column; gap: 24px">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 24px; border-bottom: 1.5px solid #2B2C30; padding-bottom: 20px">
<h1 style="margin: 0; flex: 1 1 400px; font-family: 'Big Shoulders', 'Arial Narrow', sans-serif; font-weight: 900; font-size: 104px; line-height: 0.82; letter-spacing: 0.005em">STAFF A CONSOLE</h1>
<span style="font-size: 13px; color: #A3A19A; padding-bottom: 6px">8 of 24 consoles staffed</span>
<a href="Room.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border: 1.5px solid #55565B; font-family: 'Michroma', 'Arial Black', sans-serif; font-size: 11px; letter-spacing: 0.12em; text-decoration: none">CANCEL</a>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 40px; flex-grow: 1">

<section aria-label="Position" style="flex: 1.35 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: 'Michroma', 'Arial Black', sans-serif; font-weight: 400; font-size: 11px; letter-spacing: 0.16em; color: #A3A19A">1 · POSITION</h2>
<div style="overflow-x: auto">
<div style="min-width: 600px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; padding: 4px">
<sc-for list="{{positions}}" as="p" hint-placeholder-count="15">
<button type="button" aria-pressed="{{p.pressed}}" style="appearance: none; cursor: pointer; text-align: left; min-width: 0; height: 92px; box-sizing: border-box; padding: 10px 12px; border: {{p.border}}; border-radius: 0; background: {{p.bg}}; color: {{p.fg}}; outline: {{p.outline}}; outline-offset: 3px; display: flex; flex-direction: column; justify-content: space-between; font-family: 'IBM Plex Mono', ui-monospace, monospace">
<span style="font-family: 'Michroma', 'Arial Black', sans-serif; font-size: 13px; letter-spacing: 0.06em">{{p.legend}}</span>
<span style="font-size: 11px; line-height: 1.35; color: {{p.sub}}">{{p.short}}</span>
<span style="font-weight: 600; font-size: 9.5px; letter-spacing: 0.1em; color: {{p.sub}}">{{p.tag}}</span>
</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" style="appearance: none; cursor: pointer; text-align: left; flex: 1 1 240px; min-height: 64px; padding: 10px 14px; border: 1.5px dashed #55565B; border-radius: 0; background: transparent; color: #F3F1EA; display: flex; flex-direction: column; justify-content: center; gap: 4px; font-family: 'IBM Plex Mono', ui-monospace, monospace">
<span style="font-family: 'Michroma', 'Arial Black', sans-serif; font-size: 12px; letter-spacing: 0.06em">NO POSITION</span>
<span style="font-size: 11px; color: #A3A19A">A Claude agent with your own name and role</span>
</button>
<button type="button" style="appearance: none; cursor: pointer; text-align: left; flex: 1 1 240px; min-height: 64px; padding: 10px 14px; border: 1.5px dashed #55565B; border-radius: 0; background: transparent; color: #F3F1EA; display: flex; flex-direction: column; justify-content: center; gap: 4px; font-family: 'IBM Plex Mono', ui-monospace, monospace">
<span style="font-family: 'Michroma', 'Arial Black', sans-serif; font-size: 12px; letter-spacing: 0.06em">CUSTOM COMMAND</span>
<span style="font-size: 11px; color: #A3A19A">Any program in a terminal. No hooks, no mail.</span>
</button>
</div>
<div style="margin-top: 6px; padding: 16px 18px; background: #F3F1EA; color: #060606; display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Big Shoulders', 'Arial Narrow', sans-serif; font-weight: 900; font-size: 44px; line-height: 0.9">FIDO</span>
<span style="font-size: 13px; font-weight: 600">Flight dynamics officer</span>
<span style="font-size: 13px; line-height: 1.45">Architect: picks the approach and the interfaces.</span>
</div>
</section>

<form aria-label="Console" style="flex: 1 1 420px; min-width: 0; margin: 0; display: flex; flex-direction: column; gap: 18px">
<h2 style="margin: 0; font-family: 'Michroma', 'Arial Black', sans-serif; font-weight: 400; font-size: 11px; letter-spacing: 0.16em; color: #A3A19A">2 · CONSOLE</h2>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="name" style="font-family: 'Michroma', 'Arial Black', sans-serif; font-size: 10px; letter-spacing: 0.14em">NAME</label>
<input id="name" type="text" value="fido" style="box-sizing: border-box; height: 48px; padding: 0 14px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 15px; color: #F3F1EA; background: #111214; border: 1.5px solid #55565B; border-radius: 0">
<span style="font-size: 11.5px; color: #A3A19A">Lowercase letters, digits and hyphens. Other agents address it by this name.</span>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="role" style="font-family: 'Michroma', 'Arial Black', sans-serif; font-size: 10px; letter-spacing: 0.14em">ROLE</label>
<textarea id="role" rows="6" style="box-sizing: border-box; padding: 12px 14px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12.5px; line-height: 1.5; color: #F3F1EA; background: #111214; border: 1.5px solid #55565B; border-radius: 0; resize: vertical">You are FIDO, the flight dynamics officer. You choose the approach. For each task decide the design: modules, interfaces, data flow and the order of changes. When the choice matters, weigh two options and say why you pick one. Prefer the smallest design that works.</textarea>
<span style="font-size: 11.5px; color: #A3A19A">The default for FIDO. Yours to rewrite.</span>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="dir" style="font-family: 'Michroma', 'Arial Black', sans-serif; font-size: 10px; letter-spacing: 0.14em">WORKING DIRECTORY</label>
<input id="dir" type="text" value="/projects/app" style="box-sizing: border-box; height: 48px; padding: 0 14px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 15px; color: #F3F1EA; background: #111214; border: 1.5px solid #55565B; border-radius: 0">
</div>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-family: 'Michroma', 'Arial Black', sans-serif; font-size: 11px; letter-spacing: 0.16em; color: #A3A19A">3 · PERMISSIONS</legend>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(120px, 100%), 1fr)); gap: 8px">
<button type="button" aria-pressed="true" style="appearance: none; cursor: pointer; text-align: left; min-height: 76px; padding: 10px 12px; border: 1.5px solid #F3F1EA; border-radius: 0; background: #F3F1EA; color: #060606; display: flex; flex-direction: column; gap: 6px; font-family: 'IBM Plex Mono', ui-monospace, monospace">
<span style="font-family: 'Michroma', 'Arial Black', sans-serif; font-size: 11px; letter-spacing: 0.08em">ASK</span>
<span style="font-size: 11px; line-height: 1.35">Asks you for a go before a tool runs</span>
</button>
<button type="button" aria-pressed="false" style="appearance: none; cursor: pointer; text-align: left; min-height: 76px; padding: 10px 12px; border: 1.5px solid #17181B; border-radius: 0; background: #17181B; color: #F3F1EA; display: flex; flex-direction: column; gap: 6px; font-family: 'IBM Plex Mono', ui-monospace, monospace">
<span style="font-family: 'Michroma', 'Arial Black', sans-serif; font-size: 11px; letter-spacing: 0.08em">ACCEPT EDITS</span>
<span style="font-size: 11px; line-height: 1.35; color: #A3A19A">Edits files without asking</span>
</button>
<button type="button" aria-pressed="false" style="appearance: none; cursor: pointer; text-align: left; min-height: 76px; padding: 10px 12px; border: 1.5px solid #FF4B1F; border-radius: 0; background: transparent; color: #FF4B1F; display: flex; flex-direction: column; gap: 6px; font-family: 'IBM Plex Mono', ui-monospace, monospace">
<span style="font-family: 'Michroma', 'Arial Black', sans-serif; font-size: 11px; letter-spacing: 0.08em">BYPASS</span>
<span style="font-size: 11px; line-height: 1.35">Runs every tool without asking</span>
</button>
</div>
</fieldset>

<div style="flex-grow: 1"></div>
<button type="button" style="appearance: none; cursor: pointer; height: 76px; border: 2px solid #F3F1EA; border-radius: 0; background: #F3F1EA; color: #060606; font-family: 'Big Shoulders', 'Arial Narrow', sans-serif; font-weight: 900; font-size: 40px; letter-spacing: 0.03em">STAFF FIDO</button>
</form>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    var K = '#060606', W = '#F3F1EA', M = '#A3A19A';
    function pos(legend, short, kind) {
      if (kind === 'picked') return { legend: legend, short: short, tag: 'PICKED', pressed: 'true', bg: W, fg: K, sub: '#3A3A38', border: '1.5px solid ' + W, outline: '3px solid ' + W };
      if (kind === 'boss') return { legend: legend, short: short, tag: 'THE BOSS HOLDS IT', pressed: 'false', bg: 'repeating-linear-gradient(135deg, #17181B 0 6px, #0C0C0E 6px 12px)', fg: M, sub: M, border: '1.5px solid #2B2C30', outline: 'none' };
      if (kind === 'staffed') return { legend: legend, short: short, tag: 'STAFFED · ADD ANOTHER', pressed: 'false', bg: '#17181B', fg: W, sub: M, border: '1.5px solid #17181B', outline: 'none' };
      return { legend: legend, short: short, tag: 'OPEN', pressed: 'false', bg: 'transparent', fg: W, sub: M, border: '1.5px dashed #55565B', outline: 'none' };
    }
    var positions = [
      pos('FLIGHT', 'Takes the brief, hands out work', 'boss'),
      pos('FAO', 'Planner', 'staffed'),
      pos('FIDO', 'Architect', 'picked'),
      pos('GUIDO', 'Backend and core logic', 'staffed'),
      pos('CONTROL', 'Frontend', 'staffed'),
      pos('DPS', 'Data', 'open'),
      pos('INCO', 'Integrations', 'open'),
      pos('EECOM', 'Infrastructure', 'open'),
      pos('BOOSTER', 'Build and release', 'open'),
      pos('SURGEON', 'Tests and debugging', 'staffed'),
      pos('SIMSUP', 'Adversarial tester', 'open'),
      pos('RETRO', 'Code reviewer', 'open'),
      pos('RSO', 'Security reviewer', 'staffed'),
      pos('PAO', 'Docs', 'staffed'),
      pos('CAPCOM', 'Reporter', 'open')
    ];
    return { positions: positions };
  }
}
</script>
</body>
</html>
