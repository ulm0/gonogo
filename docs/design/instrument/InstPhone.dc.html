<html lang="en">
<head>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">

<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #e4e2dc; color: #26272b; font-family: 'Geist', system-ui, sans-serif; font-size: 13px; display: flex; flex-direction: column">

<header style="display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 14px; height: 52px; box-sizing: border-box">

<div style="flex-grow: 1"></div>
<span aria-label="Link up" role="img" style="width: 8px; height: 8px; border-radius: 50%; background: #5e9e73; box-shadow: 0 0 0 3px rgba(94, 158, 115, 0.2)"></span>
<button type="button" aria-label="Staff a console" style="appearance: none; cursor: pointer; width: 44px; height: 44px; border: 1px solid #26272b; border-bottom-width: 3px; border-radius: 8px; background: #26272b; color: #f1f0ec; font-family: 'Geist Mono', monospace; font-size: 18px">+</button>
</header>

<section aria-label="The wall" style="margin: 0 12px; padding: 12px; background: #f1f0ec; border: 1px solid #c9c6be; border-radius: 12px; display: flex; flex-direction: column; gap: 10px">
<div style="background: #2b2f2a; border-radius: 8px; padding: 10px 12px; display: flex; align-items: center; gap: 12px; box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.35)">
<div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Geist Mono', monospace; font-size: 10.5px; color: #9fb79b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Add CSV export to the reports page</span>
<span style="font-family: 'Doto', 'Geist Mono', monospace; font-weight: 900; font-size: 40px; line-height: 1; color: #cfe6c9">00:10:42</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: #6b6a66">T-MINUS</span>
<span style="display: flex; gap: 4px">
<span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 50%; background: #5e9e73"></span>
<span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 50%; background: #5e9e73"></span>
<span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 50%; background: #5e9e73"></span>
<span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 50%; background: #d6d3cb; animation: ins-led 2s ease-in-out infinite"></span>
<span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 50%; background: #d6d3cb; animation: ins-led 2s ease-in-out infinite"></span>
</span>
<span style="font-family: 'Doto', 'Geist Mono', monospace; font-weight: 900; font-size: 18px">3/5</span>
<div style="flex-grow: 1"></div>
<button type="button" style="appearance: none; cursor: pointer; height: 44px; padding: 0 12px; border: 1px solid #c9c6be; border-bottom-width: 3px; border-radius: 8px; background: #faf9f6; color: #26272b; font-family: 'Geist Mono', monospace; font-size: 10.5px">HOLD</button>
<button type="button" style="appearance: none; cursor: pointer; height: 44px; padding: 0 12px; border: 1px solid #c9c6be; border-bottom-width: 3px; border-radius: 8px; background: #faf9f6; color: #a8323c; font-family: 'Geist Mono', monospace; font-size: 10.5px">ABORT</button>
</div>
<div style="display: flex; align-items: center; gap: 8px; font-family: 'Geist Mono', monospace; font-size: 10.5px; color: #44463f">
<span style="letter-spacing: 0.08em; color: #6b6a66">MAX Q</span>
<span role="img" aria-label="2 of 3 working" style="display: flex; gap: 3px"><span style="width: 18px; height: 6px; border-radius: 3px; background: #4a5bd4"></span><span style="width: 18px; height: 6px; border-radius: 3px; background: #4a5bd4"></span><span style="width: 18px; height: 6px; border-radius: 3px; background: #d6d3cb"></span></span>
<span>2 of 3 working</span>
</div>

<a href="InstGo.dc.html" style="margin: 10px 12px 0; padding: 10px 12px; border-radius: 12px; background: #f4e3b7; border: 1px solid #d9b45a; display: flex; align-items: center; gap: 10px; text-decoration: none; min-height: 44px">
<span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #e0a93a; box-shadow: 0 0 0 4px rgba(224, 169, 58, 0.25); animation: ins-led 1.6s ease-in-out infinite"></span>

<span style="font-weight: 600; font-size: 14px">SURGEON asks for a go</span>

</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.06em">ANSWER ›</span>
</a>

<section aria-label="Operations" style="flex-grow: 1; min-height: 0; padding: 12px 12px 0; overflow: hidden">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{mods}}" as="m" hint-placeholder-count="15">
<button type="button" style="appearance: none; cursor: pointer; text-align: left; min-width: 0; height: 64px; padding: 7px 8px 6px; border: 1px {{m.style}} {{m.bd}}; border-bottom-width: {{m.bb}}; border-radius: 9px; background: {{m.bg}}; color: {{m.fg}}; display: flex; flex-direction: column; justify-content: space-between; font-family: 'Geist', sans-serif">
<span style="display: flex; align-items: center; gap: 6px">
<span aria-hidden="true" style="flex: none; width: 7px; height: 7px; border-radius: 50%; background: {{m.led}}; animation: {{m.anim}}"></span>
<span style="font-family: 'Geist Mono', monospace; font-weight: 600; font-size: 10.5px; letter-spacing: 0.02em">{{m.call}}</span>
</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 9.5px; color: #44463f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.l1}}</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 9.5px; color: #44463f">{{m.state}}</span>
</button>
</sc-for>
</div>
</section>

<nav aria-label="Sections" style="display: flex; gap: 6px; padding: 8px 12px 12px; background: #e4e2dc">
<a href="InstPhone.dc.html" aria-current="page" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; height: 48px; border: 1px solid #26272b; border-bottom-width: 3px; border-radius: 9px; background: #26272b; color: #f1f0ec; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-decoration: none">ROOM</a>
<a href="#loop" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 6px; height: 48px; border: 1px solid #c9c6be; border-bottom-width: 3px; border-radius: 9px; background: #faf9f6; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-decoration: none">LOOP <span style="padding: 1px 6px; border-radius: 999px; background: #f4e3b7; font-size: 10px">2</span></a>
<a href="#brief" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; height: 48px; border: 1px solid #c9c6be; border-bottom-width: 3px; border-radius: 9px; background: #faf9f6; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-decoration: none">BRIEF</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    function mod(call, kind, l1, state) {
      var m = { call: call, l1: l1 || '', state: state, anim: 'none', fg: '#26272b' };
      if (kind === 'working') { m.bg = '#faf9f6'; m.bd = '#c9c6be'; m.style = 'solid'; m.bb = '3px'; m.led = '#4a5bd4'; m.anim = 'ins-led 1.4s ease-in-out infinite'; }
      else if (kind === 'needs') { m.bg = '#f4e3b7'; m.bd = '#d9b45a'; m.style = 'solid'; m.bb = '3px'; m.led = '#e0a93a'; m.anim = 'ins-led 1.6s ease-in-out infinite'; }
      else if (kind === 'idle') { m.bg = '#faf9f6'; m.bd = '#c9c6be'; m.style = 'solid'; m.bb = '3px'; m.led = '#5e9e73'; }
      else if (kind === 'stopped') { m.bg = '#e9e7e1'; m.bd = '#c9c6be'; m.style = 'solid'; m.bb = '1px'; m.led = '#c9c6be'; m.fg = '#6b6a66'; }
      else { m.bg = 'transparent'; m.bd = '#b9b6ae'; m.style = 'dashed'; m.bb = '1px'; m.led = 'transparent'; m.fg = '#6b6a66'; }
      return m;
    }
    return { mods: [
      mod('FLIGHT', 'idle', 'Polled the room.', 'IDLE 2M'),
      mod('FAO', 'idle', 'Plan v2 sent.', 'IDLE · GO'),
      mod('FIDO', 'open', 'Architect', 'OPEN'),
      mod('GUIDO', 'working', 'Update csv.ts', 'WORK · GO'),
      mod('CONTROL', 'working', 'Write Export…', 'WORK · WAIT'),
      mod('DPS', 'open', 'Data', 'OPEN'),
      mod('INCO', 'open', 'Integrations', 'OPEN'),
      mod('EECOM', 'open', 'Infrastructure', 'OPEN'),
      mod('BOOSTER', 'open', 'Release', 'OPEN'),
      mod('SURGEON', 'needs', 'test:e2e', 'YOU · WAIT'),
      mod('SIMSUP', 'open', 'Breaks things', 'OPEN'),
      mod('RETRO', 'open', 'Reviewer', 'OPEN'),
      mod('RSO', 'idle', 'No findings.', 'IDLE · GO'),
      mod('PAO', 'stopped', 'Stopped.', 'STOP 21M'),
      mod('LOGS', 'working', 'tail -f app.log', 'PRINTING')
    ] };
  }
}
</script>
</body>
</html>
