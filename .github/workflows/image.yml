name: Image

# Every run builds linux/amd64 and linux/arm64, each on a runner of its own architecture (no QEMU).
# A push to main builds both and pushes nothing; so does a pull request, but only one that touches the image's own files (the Dockerfile, what it
# installs from, the scripts it copies, this file): CI already builds and packs the code on every pull request, and main catches the rest.
# A pushed v* tag pushes each platform to ghcr.io by digest, then one job joins the digests into a multi-arch
# manifest list tagged <version>, <major>.<minor> and latest (latest only for a tag without a pre-release suffix).
# A run by hand (Run workflow) runs only update-e2e, the last job.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - packaging/docker/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/image.yml
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      from:
        description: "update-e2e: the version to start from, x.y.z (0.8.0 or later). Default is the stable release before the newest"
        required: false
        type: string
      to:
        description: "update-e2e: the version to update to, x.y.z, which must be what ghcr.io/ulm0/gonogo latest is. Default is the newest stable release"
        required: false
        type: string

permissions: {}

concurrency:
  group: image-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux/amd64, arch: amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max,ignore-error=true

  publish:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux/amd64, arch: amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # No tag is pushed here (the image goes by digest), but the first tag decides the label org.opencontainers.image.version: with the default (the git
          # ref) it was "v0.11.0", and the Docker self-update, which reads that label as the release number, refused every image. Now it is "0.11.0".
          tags: |
            type=semver,pattern={{version}}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # No tag here: the image is pushed by its digest only, and the merge job names it.
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max,ignore-error=true
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      packages: write
      # the build provenance attestation below (a signed statement that this workflow built the image), which gonogo's self-update verifies with `gh attestation verify`
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # The OCI annotations (source, description, licence, version) go on the manifest list, which has no labels.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ghcr.io/${{ github.repository }}
          # latest=auto adds `latest` on a semver tag without a pre-release suffix.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "--tag=" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          mapfile -t annotations < <(jq -r '.annotations[] | "--annotation=" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${annotations[@]}" "${sources[@]}"
      - name: Inspect it
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
      # The digest a pull of any of the tags resolves to (the manifest list): that is what the self-update checks, so that is what is attested.
      - id: index
        name: Read the digest of the manifest list
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: echo "digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  # update-e2e: the Docker self-update, end to end, on the runner's own Docker (an isolated, throwaway machine): gonogo of the previous release is
  # started from its image, updated to the current release through the real path (pull, `gh attestation verify` with this job's GITHUB_TOKEN,
  # helper, health check), asserted to run, then UNDOne back. scripts/update-e2e.sh does the work; the job only picks the two versions and gives it
  # the token. Only images of this repository on ghcr.io are pulled, and the only credential is the job's own GITHUB_TOKEN (read access to the
  # attestations). The update takes the container's moving tag, so TO must be what `ghcr.io/ulm0/gonogo:latest` is: it runs after merge pushed
  # and attested a stable release (a v* tag without a pre-release suffix), and TO is that tag; FROM is the stable release before it. By hand (Run
  # workflow, also on a branch that changes scripts/update-e2e.sh) only this job runs, and both can be given.
  update-e2e:
    needs: merge
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.merge.result == 'success' && !contains(github.ref_name, '-'))) }}
    concurrency:
      group: update-e2e-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick the two versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_FROM: ${{ inputs.from }}
          INPUT_TO: ${{ inputs.to }}
          # set only when image.yml called this for a pushed tag (its event is that push): the tag IS the release that was just built
          RUN_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          set -euo pipefail
          # the stable releases of this repository, newest first (x.y.z only; a pre-release has a suffix)
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name | ltrimstr("v")' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' > "$RUNNER_TEMP/releases.txt"
          # TO: what was asked; else the tag image.yml was run for (the GitHub Release may not be marked yet when the image is
          # pushed, and :latest is already the new one); else the newest stable release
          to=${INPUT_TO:-${RUN_TAG#v}}
          to=${to:-$(sed -n 1p "$RUNNER_TEMP/releases.txt")}
          [[ "$to" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::TO '$to' is not x.y.z"; exit 1; }
          # FROM: what was asked; else the newest stable release BELOW TO (the list may or may not have TO yet)
          below() { while read -r v; do [ "$v" != "$to" ] && [ "$(printf '%s\n%s\n' "$v" "$to" | sort -V | head -1)" = "$v" ] && { echo "$v"; return; }; done < <(sort -Vr "$RUNNER_TEMP/releases.txt"); }
          from=${INPUT_FROM:-$(below)}
          # FROM is checked like TO before it is written anywhere (an input by hand is free text)
          [[ "$from" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::FROM '$from' is not x.y.z"; exit 1; }
          [ -n "$to" ] && [ -n "$from" ] || { echo "::error::could not pick two releases from: $(tr '\n' ' ' < "$RUNNER_TEMP/releases.txt")"; exit 1; }
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "to=$to" >> "$GITHUB_OUTPUT"
          echo "update $from -> $to"
      - name: Update end to end, then UNDO
        env:
          # read by `gh attestation verify` inside the container, by name: never printed
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ steps.versions.outputs.from }}
          TO: ${{ steps.versions.outputs.to }}
        run: scripts/update-e2e.sh "$FROM" "$TO"
