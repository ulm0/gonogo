name: Browser smoke

# One real-browser pass (Chromium, Playwright) over the built server and the stand-in agent: setup, login with a second factor,
# styles, a room with a live link and a console, the service worker (browser/smoke.spec.ts). Three 0.5.x bugs passed every other
# test and broke in a browser. It runs on pull requests that touch the page or the auth and web code, by hand, and as the first
# job of the release (a failure blocks the publish).
on:
  pull_request:
    paths:
      - 'src/client/**'
      - 'src/server/auth*'
      - 'src/server/roomproxy*'
      - 'src/server/roomspage*'
      - 'src/server/supervisor*'
      - 'src/server/web*'
      - '**/*.css'
      - 'public/**'
      - 'index.html'
      - 'src/shared/**'
      - 'src/server/cli.ts'
      - 'src/server/home.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'browser/**'
      - 'playwright.config.ts'
      - '.github/workflows/browser.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The ref to test; the release passes its tag (a run by hand is dispatched from a branch)
        type: string
        required: false

permissions: {}

concurrency:
  group: browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      # No version: it installs the pnpm that package.json `packageManager` pins.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Chromium is about 150 MB: cached by the Playwright version in the lockfile. The system libraries are not cached (install-deps is quick).
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright.outputs.version }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm exec playwright test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-smoke-failure
          path: browser-results/
          retention-days: 7
