name: Browser

# Real browsers (Playwright) over the built server and the stand-in agent. Three 0.5.x bugs passed every other test and broke in a browser.
# - smoke: one Chromium pass (browser/smoke.spec.ts): setup, login with a second factor, styles, a room with a live link and a console, the
#   service worker. On pull requests that touch the page or the auth and web code, by hand, and as the first job of the release (a failure
#   blocks the publish).
# - engines (browsers.yml through 0.22): the same smoke on Firefox and WebKit. Not part of the release gate: they report engine differences
#   (a CSP, a cookie rule, a layout). Weekly on main and by hand (run: engines).
# - screens (screens.yml through 0.22): screenshots of every view for the UI/UX audit (browser/screens.spec.ts), each view at 1280x800 and
#   390x844, light and dark, and the docs site; one artifact, screens-<sha>, with an index.html grid. Only by hand (run: screens).
on:
  pull_request:
    paths:
      - 'src/client/**'
      - 'src/server/auth*'
      - 'src/server/roomproxy*'
      - 'src/server/roomspage*'
      - 'src/server/supervisor*'
      - 'src/server/web*'
      - '**/*.css'
      - 'public/**'
      - 'index.html'
      - 'src/shared/**'
      - 'src/server/cli.ts'
      - 'src/server/home.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'browser/**'
      - 'playwright.config.ts'
      - '.github/workflows/browser.yml'
  schedule:
    - cron: '29 3 * * 1'
  workflow_dispatch:
    inputs:
      run:
        description: What to run
        type: choice
        options: [smoke, engines, screens]
        default: smoke
  workflow_call:
    inputs:
      ref:
        description: The ref to test; the release passes its tag (a run by hand is dispatched from a branch)
        type: string
        required: false

permissions: {}

concurrency:
  group: browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # inputs.run is empty when the release calls this (its own dispatch has no such input): the smoke runs
    if: ${{ github.event_name != 'schedule' && inputs.run != 'engines' && inputs.run != 'screens' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      # No version: it installs the pnpm that package.json `packageManager` pins.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Chromium is about 150 MB: cached by the Playwright version in the lockfile. The system libraries are not cached (install-deps is quick).
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright.outputs.version }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm exec playwright test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-smoke-failure
          path: browser-results/
          retention-days: 7

  engines:
    if: ${{ github.event_name == 'schedule' || inputs.run == 'engines' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No version: it installs the pnpm that package.json `packageManager` pins.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.engine }}-${{ steps.playwright.outputs.version }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      - if: steps.cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.engine }}
      - run: pnpm exec playwright test browser/smoke.spec.ts
        env:
          PW_BROWSERS: ${{ matrix.engine }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browsers-failure-${{ matrix.engine }}
          path: browser-results/
          retention-days: 7

  screens:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run == 'screens' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm docs:build
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright.outputs.version }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm exec playwright test browser/screens.spec.ts
        env:
          SCREENS: '1'
          SCREENS_DOCS: '1'
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screens-${{ github.sha }}
          path: screens/
          retention-days: 14
