name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No version: it installs the pnpm that package.json `packageManager` pins.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The lowest Node that `engines` allows, and the Node of the Docker image.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec vitest run
      - run: pnpm build
      - run: pnpm check:pack
      # The site is published on a release, so a broken page is caught here, on the pull request.
      - run: pnpm docs:build

  # Every compose file must parse and interpolate: compose.yaml alone, and with each overlay (compose.*.yaml). Placeholder values only;
  # nothing is pulled or started, so no real tunnel or secret is involved.
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GONOGO_DATA: /srv/gonogo
          DOCKER_GID: '999'
          GONOGO_PUBLIC_NAME: gonogo.example.com
          TS_AUTHKEY: tskey-auth-placeholder
          NGROK_AUTHTOKEN: placeholder
          TUNNEL_TOKEN: placeholder
        run: |
          docker compose version
          docker compose -f compose.yaml config --quiet
          for overlay in compose.*.yaml; do
            echo "== $overlay"
            docker compose -f compose.yaml -f "$overlay" config --quiet
          done

  # The published image run by compose.yaml itself: a name in GONOGO_ALLOWED_HOSTS must reach the container (it once did not: the file never
  # forwarded it, and every name but localhost got "forbidden host"). Only the compose file is under test, so the image is the published one.
  compose-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start gonogo with compose.yaml and an allowed name
        env:
          GONOGO_PORT: '17777'
          GONOGO_ALLOWED_HOSTS: example.test
        run: |
          data="$RUNNER_TEMP/gonogo-data"
          sudo install -d -o 1000 -g 1000 -m 0755 "$data" "$data/state" "$data/claude" "$data/projects" "$data/home"
          export GONOGO_DATA="$data" DOCKER_GID="$(stat -L -c %g /var/run/docker.sock)"
          docker compose up -d
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:17777/rooms/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:17777/rooms/health
          allowed=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: example.test:7777' http://127.0.0.1:17777/)
          other=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: other.test:7777' http://127.0.0.1:17777/)
          echo "example.test: $allowed, other.test: $other"
          [[ "$allowed" =~ ^(200|30[1-8])$ ]] || { echo "::error::a name in GONOGO_ALLOWED_HOSTS got $allowed: compose.yaml does not forward it"; exit 1; }
          [ "$other" = 403 ] || { echo "::error::a name nobody allowed got $other, not 403"; exit 1; }
      - if: always()
        env:
          GONOGO_DATA: /nonexistent
          DOCKER_GID: '0'
        run: |
          docker compose logs --tail 40 || true
          docker compose down -v --timeout 20 || true

  # CHANGELOG.md is changed only by the release pull request (it also changes the version); everyone else adds changes/<branch>.md.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE...HEAD" | grep -qx CHANGELOG.md; then
            before=$(git show "origin/$BASE:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
            after=$(node -p 'require("./package.json").version')
            if [ "$before" = "$after" ]; then
              echo "::error file=CHANGELOG.md::Do not edit CHANGELOG.md in a pull request (it conflicts with every other one). Add changes/<branch>.md instead; see changes/README.md."
              exit 1
            fi
          fi
