name: CI

# The one workflow of a pull request and of a push to main.
# - check (every run): typecheck, tests, build, pack, the multivac conformance, the docs site. changelog (pull requests): CHANGELOG.md is left to
#   the release.
# - The other jobs run only when their own files changed (the `changes` job reads the diff):
#   smoke: one Chromium pass (browser/smoke.spec.ts) over the built server and the stand-in agent; pull requests only. Three 0.5.x bugs passed
#     every other test and broke in a browser.
#   platform: the packed tarball installed on each operating system, `gonogo --version` and `gonogo doctor`. Windows is not a supported
#     platform (package.json `os` is darwin and linux): its leg checks that npm refuses the install with EBADPLATFORM.
#   pack, systemd, openrc, launchd: `gonogo service install` against a real service manager; a room is started, reloaded and removed.
#   parse, run, zero: compose.yaml alone and with each overlay must parse; the PUBLISHED image run by compose.yaml with a .env and with
#     exported variables piped in; the image built from this checkout run with NOTHING set (`docker compose up -d` must be enough).
#   formula: the Homebrew formula (packaging/homebrew/gonogo.rb) installed, tested and audited on macOS and Linux; pull requests only.
# - release.yml calls this (workflow_call) with run: smoke (its gate before the publish) and run: brew; then only that part runs, on the tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      run:
        description: The one part to run (smoke or brew); the release passes it
        type: string
        required: true
      ref:
        description: The ref to test; the release passes its tag
        type: string
        required: true

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.run }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts the change touches. Called by the release: only the part it asked for.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      smoke: ${{ steps.diff.outputs.smoke }}
      npm: ${{ steps.diff.outputs.npm }}
      service: ${{ steps.diff.outputs.service }}
      compose: ${{ steps.diff.outputs.compose }}
      brew: ${{ steps.diff.outputs.brew }}
    steps:
      - if: ${{ !inputs.run }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          RUN: ${{ inputs.run }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          parts="smoke npm service compose brew"
          set_all() { for p in $parts; do echo "$p=$1" >> "$GITHUB_OUTPUT"; done; }
          if [ -n "$RUN" ]; then
            for p in $parts; do if [ "$p" = "$RUN" ]; then echo "$p=true"; else echo "$p=false"; fi >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          # a base the clone does not have (a force push, the first push of a branch): every part
          if ! files=$(git diff --name-only "$BASE...HEAD" 2>/dev/null); then set_all true; exit 0; fi
          echo "$files"
          has() { if grep -qE "$1" <<< "$files"; then echo "$2=true"; else echo "$2=false"; fi >> "$GITHUB_OUTPUT"; }
          if [ "$EVENT" = pull_request ]; then
            has '^(src/client/|src/server/(auth|roomproxy|roomspage|supervisor|web)[^/]*$|public/|index\.html$|src/shared/|src/server/(cli|home)\.ts$|package\.json$|pnpm-lock\.yaml$|vite\.config\.ts$|browser/|playwright\.config\.ts$|\.github/workflows/ci\.yml$)|\.css$' smoke
            has '^(packaging/homebrew/|\.github/workflows/ci\.yml$)' brew
          else
            echo "smoke=false" >> "$GITHUB_OUTPUT"
            echo "brew=false" >> "$GITHUB_OUTPUT"
          fi
          has '^(package\.json|pnpm-lock\.yaml|bin/|scripts/check-pack\.mjs|\.github/workflows/ci\.yml)' npm
          has '^(src/server/(service|reload|cli)\.ts|package\.json|\.github/workflows/ci\.yml)$' service
          has '^(compose(\.[^/]*)?\.yaml|Dockerfile|packaging/docker/|\.github/workflows/ci\.yml)' compose

  check:
    if: ${{ !inputs.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No version: it installs the pnpm that package.json `packageManager` pins.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The lowest Node that `engines` allows, and the Node of the Docker image.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec vitest run
      - run: pnpm build
      - run: pnpm check:pack
      # Does `gonogo knowledge export --multivac` read as multivac's own file? A pinned multivac with locked dependencies, about half a minute.
      - run: node scripts/multivac-conformance.mjs
      # The site is published on a release, so a broken page is caught here, on the pull request.
      - run: pnpm docs:build

  # CHANGELOG.md is changed only by the release pull request (it also changes the version); everyone else adds changes/<branch>.md.
  changelog:
    if: ${{ github.event_name == 'pull_request' && !inputs.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE...HEAD" | grep -qx CHANGELOG.md; then
            before=$(git show "origin/$BASE:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
            after=$(node -p 'require("./package.json").version')
            if [ "$before" = "$after" ]; then
              echo "::error file=CHANGELOG.md::Do not edit CHANGELOG.md in a pull request (it conflicts with every other one). Add changes/<branch>.md instead; see changes/README.md."
              exit 1
            fi
          fi

  # browser
  smoke:
    needs: changes
    if: ${{ needs.changes.outputs.smoke == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      # No version: it installs the pnpm that package.json `packageManager` pins.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Chromium is about 150 MB: cached by the Playwright version in the lockfile. The system libraries are not cached (install-deps is quick).
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright.outputs.version }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm exec playwright test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-smoke-failure
          path: browser-results/
          retention-days: 7

  # npm
  platform:
    needs: changes
    if: ${{ needs.changes.outputs.npm == 'true' }}
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, supported: true }
          - { os: ubuntu-24.04-arm, supported: true }
          - { os: macos-latest, supported: true }
          - { os: windows-latest, supported: false }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No version: it installs the pnpm that package.json `packageManager` pins.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Pack
        run: |
          mkdir "$RUNNER_TEMP/pack"
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          ls "$RUNNER_TEMP/pack"
      - name: On Windows npm refuses the install
        if: ${{ !matrix.supported }}
        run: |
          if npm install -g "$RUNNER_TEMP"/pack/*.tgz > "$RUNNER_TEMP/install.log" 2>&1; then
            echo "::error::npm installed gonogo on an unsupported platform"; exit 1
          fi
          cat "$RUNNER_TEMP/install.log"
          grep -q EBADPLATFORM "$RUNNER_TEMP/install.log" || { echo "::error::the install failed, but not with EBADPLATFORM"; exit 1; }
      - name: Install the tarball globally
        if: ${{ matrix.supported }}
        run: npm install -g "$RUNNER_TEMP"/pack/*.tgz
      - name: gonogo --version is the package's version
        if: ${{ matrix.supported }}
        run: |
          want="gonogo $(node -p 'require("./package.json").version')"
          got=$(gonogo --version | head -n1)
          echo "$got"
          [ "$got" = "$want" ] || { echo "::error::gonogo --version printed '$got', expected '$want'"; exit 1; }
      # doctor exits 1 when no claude is found; the stand-in command satisfies that check so only a real failure fails the step.
      - name: gonogo doctor runs
        if: ${{ matrix.supported }}
        env:
          GONOGO_AGENT_CMD: node
        run: gonogo doctor

  # service
  pack:
    needs: changes
    if: ${{ needs.changes.outputs.service == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No version: it installs the pnpm that package.json `packageManager` pins.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: |
          mkdir pack
          pnpm pack --pack-destination pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: pack/*.tgz
          if-no-files-found: error

  systemd:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: pack
      - run: npm install -g "$PWD"/pack/*.tgz
      # A user manager for the runner's user: lingering starts user@<uid>.service, and the commands below talk to its bus.
      - name: A systemd user manager
        run: |
          sudo loginctl enable-linger "$USER"
          for i in $(seq 1 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: A stand-in claude (gonogo refuses to start without one on the PATH; as an agent it just sleeps)
        run: |
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\nexec sleep 1234567\n' > "$HOME/bin/claude"
          chmod +x "$HOME/bin/claude"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: install starts it, an agent survives a reload, install again restarts, start and stop, uninstall
        run: |
          set -x
          health() { curl -fsS http://127.0.0.1:7788/rooms/health; }
          # install writes, enables and starts: no reboot, no second command
          gonogo service install --pty-host --port 7788
          for i in $(seq 1 40); do health && break; sleep 1; done
          health
          gonogo service status
          unit=~/.config/systemd/user/gonogo.service
          grep -q "^ExecStart=$(command -v node) " "$unit"
          grep -q "^WorkingDirectory=$HOME$" "$unit"
          grep -q "$HOME/bin" "$unit"
          # an agent (the stand-in claude, FLIGHT's console) runs in the pty host
          curl -fsS -X POST -H "Authorization: Bearer $(cat ~/.gonogo/token)" -H 'content-type: application/json' -d '{}' http://127.0.0.1:7788/api/agents/flight/restart > /dev/null
          for i in $(seq 1 30); do agent=$(pgrep -f '[s]leep 1234567' | head -1); [ -n "$agent" ] && break; sleep 1; done
          [ -n "$agent" ] || { echo "::error::the agent did not start"; exit 1; }
          before=$(systemctl --user show -p MainPID --value gonogo.service)
          gonogo reload
          for i in $(seq 1 40); do
            now=$(systemctl --user show -p MainPID --value gonogo.service)
            [ "$now" != "$before" ] && [ "$now" != 0 ] && health && break
            sleep 1
          done
          [ "$now" != "$before" ] && [ "$now" != 0 ] || { echo "::error::the manager did not start a new gonogo after reload"; systemctl --user status gonogo.service || true; exit 1; }
          systemctl --user is-active gonogo.service
          # one gonogo supervisor, and the agent is the very same process
          [ "$(pgrep -fc 'gonogo --home')" = 1 ]
          [ "$(pgrep -f '[s]leep 1234567' | head -1)" = "$agent" ] || { echo "::error::the agent did not survive the reload"; exit 1; }
          # installing again rewrites the unit and restarts it
          before=$(systemctl --user show -p MainPID --value gonogo.service)
          gonogo service install --pty-host --port 7788
          for i in $(seq 1 40); do health && break; sleep 1; done
          [ "$(systemctl --user show -p MainPID --value gonogo.service)" != "$before" ]
          gonogo service stop
          ! systemctl --user is-active gonogo.service
          gonogo service start
          for i in $(seq 1 40); do health && break; sleep 1; done
          gonogo service restart
          for i in $(seq 1 40); do health && break; sleep 1; done
          gonogo service uninstall
          ! systemctl --user is-active gonogo.service
          [ ! -e "$unit" ]
          # a foreground gonogo on the port: no second one is started
          node -e 'require("net").createServer().listen(7788, "127.0.0.1")' &
          listener=$!
          sleep 1
          if gonogo service install --pty-host --port 7788 > out.txt 2>&1; then echo "::error::install started beside a listener"; exit 1; fi
          cat out.txt
          grep -q 'stop the running gonogo first (Ctrl+C), then run gonogo service start' out.txt
          ! systemctl --user is-active gonogo.service
          kill "$listener"
          gonogo service start
          for i in $(seq 1 40); do health && break; sleep 1; done
          gonogo service uninstall
          # a space in --home reaches gonogo as one word
          gonogo service install --pty-host --port 7788 --home "$HOME/my agents"
          for i in $(seq 1 40); do health && break; sleep 1; done
          [ -f "$HOME/my agents/token" ]
          grep -q -- "--home \"$HOME/my agents\"" "$unit"
          gonogo service uninstall
      - if: failure()
        run: journalctl --user -u gonogo.service --no-pager | tail -60

  openrc:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: pack
      # Debian with OpenRC (a glibc system: gonogo's pty library has no musl build, so Alpine cannot run agents); --init so that a stopped
      # service's process is reaped (the container's own pid 1 would not)
      - name: install, an agent surviving a reload, uninstall under OpenRC
        run: |
          docker run --rm --init -v "$PWD/pack:/pk:ro" node:24-bookworm sh -ec '
            apt-get update >/dev/null
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openrc curl procps >/dev/null
            mkdir -p /run/openrc && touch /run/openrc/softlevel
            useradd -m ana
            npm install -g /pk/*.tgz >/dev/null 2>&1
            printf "#!/bin/sh\nexec sleep 1234567\n" > /usr/local/bin/claude && chmod +x /usr/local/bin/claude
            # as root with no user to run as: refused
            ! gonogo service install --pty-host 2>/dev/null
            gonogo service install --user ana --pty-host --port 7788
            for i in $(seq 1 40); do curl -fsS http://127.0.0.1:7788/rooms/health >/dev/null && break; sleep 1; done
            curl -fsS http://127.0.0.1:7788/rooms/health
            gonogo service status
            # runs as ana, not as root
            ps -eo user,args | grep "gonogo --home" | grep -v grep | grep -q "^ana "
            # an agent in the pty host; it must be the same process after the reload
            curl -fsS -X POST -H "Authorization: Bearer $(cat /home/ana/.gonogo/token)" -H "content-type: application/json" -d "{}" http://127.0.0.1:7788/api/agents/flight/restart >/dev/null
            for i in $(seq 1 30); do agent=$(pgrep -u ana -f "[s]leep 1234567" | head -1); [ -n "$agent" ] && break; sleep 1; done
            [ -n "$agent" ]
            before=$(pgrep -u ana -f "gonogo --home" | head -1)
            su ana -c "gonogo reload --home /home/ana/.gonogo"
            for i in $(seq 1 40); do
              now=$(pgrep -u ana -f "gonogo --home" | head -1)
              [ -n "$now" ] && [ "$now" != "$before" ] && curl -fsS http://127.0.0.1:7788/rooms/health >/dev/null && break
              sleep 1
            done
            [ "$now" != "$before" ]
            [ "$(pgrep -u ana -f "[s]leep 1234567" | head -1)" = "$agent" ]
            gonogo service status
            # a space in --home reaches gonogo as one word (openrc-run evals the arguments)
            gonogo service install --user ana --pty-host --port 7788 --home "/home/ana/my agents"
            for i in $(seq 1 40); do curl -fsS http://127.0.0.1:7788/rooms/health >/dev/null && break; sleep 1; done
            [ -f "/home/ana/my agents/token" ]
            gonogo service install --user ana --pty-host --port 7788
            for i in $(seq 1 40); do curl -fsS http://127.0.0.1:7788/rooms/health >/dev/null && break; sleep 1; done
            # without root: the sudo line comes first
            su ana -c "gonogo service install --pty-host --port 7788" > /tmp/out.txt 2>&1 && exit 1
            head -1 /tmp/out.txt | grep -q "This needs root: run .sudo gonogo service install --port 7788 --pty-host."
            gonogo service uninstall
            [ ! -e /etc/init.d/gonogo ]
            [ -z "$(pgrep -u ana -f "gonogo --home")" ]
          '

  launchd:
    needs: pack
    runs-on: macos-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: pack
      - run: npm install -g "$PWD"/pack/*.tgz
      # --no-start: a CI runner has no login session to load a LaunchAgent into. The file is what has to be right.
      - name: install with --no-start, lint the plist, uninstall
        run: |
          set -x
          gonogo service install --pty-host --port 7788 --no-start
          plist="$HOME/Library/LaunchAgents/com.ulm0.gonogo.plist"
          plutil -lint "$plist"
          /usr/libexec/PlistBuddy -c 'Print :KeepAlive' -c 'Print :RunAtLoad' -c 'Print :AbandonProcessGroup' -c 'Print :ProgramArguments:0' "$plist"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :ProgramArguments:0' "$plist")" = "$(command -v node)" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :WorkingDirectory' "$plist")" = "$HOME" ]
          gonogo service status || [ $? = 3 ]
          gonogo service uninstall
          [ ! -e "$plist" ]

  # compose
  # Every compose file must parse and interpolate: compose.yaml alone, and with each overlay (compose.*.yaml). Placeholder values only;
  # nothing is pulled or started, so no real tunnel or secret is involved.
  parse:
    needs: changes
    if: ${{ needs.changes.outputs.compose == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GONOGO_DATA: /srv/gonogo
          DOCKER_GID: '999'
          GONOGO_PUBLIC_NAME: gonogo.example.com
          TS_AUTHKEY: tskey-auth-placeholder
          NGROK_AUTHTOKEN: placeholder
          TUNNEL_TOKEN: placeholder
        run: |
          docker compose version
          docker compose -f compose.yaml config --quiet
          for overlay in compose.*.yaml; do
            echo "== $overlay"
            docker compose -f compose.yaml -f "$overlay" config --quiet
          done

  # The published image run by compose.yaml itself: a (private) name in GONOGO_ALLOWED_HOSTS must reach the container (a public one is refused without the login account; it once did not: the file never
  # forwarded it, and every name but localhost got "forbidden host"). Only the compose file is under test, so the image is the published one.
  run:
    needs: changes
    if: ${{ needs.changes.outputs.compose == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # What the docs and the 403 page say to do: a .env next to compose.yaml, nothing exported.
      - name: Start gonogo with a .env file
        run: |
          data="$RUNNER_TEMP/gonogo-data"
          sudo install -d -o 1000 -g 1000 -m 0755 "$data" "$data/state" "$data/claude" "$data/projects" "$data/home"
          printf 'GONOGO_DATA=%s\nDOCKER_GID=%s\nGONOGO_PORT=17777\nGONOGO_ALLOWED_HOSTS=box.local\n' "$data" "$(stat -L -c %g /var/run/docker.sock)" > .env
          docker compose up -d
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:17777/rooms/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:17777/rooms/health
          allowed=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: box.local:7777' http://127.0.0.1:17777/)
          other=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: other.test:7777' http://127.0.0.1:17777/)
          echo "box.local: $allowed, other.test: $other"
          [[ "$allowed" =~ ^(200|30[1-8])$ ]] || { echo "::error::a name in .env GONOGO_ALLOWED_HOSTS got $allowed: compose.yaml does not forward it"; exit 1; }
          [ "$other" = 403 ] || { echo "::error::a name nobody allowed got $other, not 403"; exit 1; }
          docker compose down --timeout 20
          rm .env
      # The Director's own flow: variables exported by his .envrc, then the compose file piped in from the repository (curl .../compose.yaml | docker compose -f - up -d).
      - name: Start gonogo from the file on stdin with the exported variables
        run: |
          data="$RUNNER_TEMP/gonogo-data"
          sudo install -d -o 1000 -g 1000 -m 0755 "$data" "$data/state" "$data/claude" "$data/projects" "$data/home"
          export GONOGO_DATA="$data"
          export DOCKER_GID="$(stat -L -c %g /var/run/docker.sock)"
          export GONOGO_HOST="0.0.0.0"
          export GONOGO_PORT=17777
          export GONOGO_ALLOWED_HOSTS="192.168.86.222,${HOSTNAME},${HOSTNAME}.local"
          cat compose.yaml | docker compose -f - up -d
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:17777/rooms/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:17777/rooms/health
          for name in 192.168.86.222 "$HOSTNAME" "$HOSTNAME.local"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: $name:7777" http://127.0.0.1:17777/)
            echo "$name: $code"
            [[ "$code" =~ ^(200|30[1-8])$ ]] || { echo "::error::$name is in GONOGO_ALLOWED_HOSTS and got $code: compose.yaml does not forward it"; exit 1; }
          done
          other=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: other.test:7777' http://127.0.0.1:17777/)
          echo "other.test: $other"
          [ "$other" = 403 ] || { echo "::error::a name nobody allowed got $other, not 403"; exit 1; }
      - if: always()
        run: |
          docker logs --tail 40 "$(docker ps -aq --filter label=com.docker.compose.service=gonogo | head -1)" || true
          docker rm -f $(docker ps -aq --filter label=com.docker.compose.service=gonogo) || true

  zero:
    needs: changes
    if: ${{ needs.changes.outputs.compose == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image the compose file names
        run: docker build -t ghcr.io/ulm0/gonogo:latest .
      - name: docker compose up -d, with nothing set
        run: |
          mkdir "$RUNNER_TEMP/zero"
          cp compose.yaml "$RUNNER_TEMP/zero/"
          cd "$RUNNER_TEMP/zero"
          # nothing of gonogo's is in the environment, and there is no .env
          env | grep -E '^(GONOGO_|DOCKER_GID)' && exit 1
          docker compose up -d --pull never
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:7777/rooms/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:7777/rooms/health
          # the data folder compose made is uid 1000's: the entrypoint gave it
          [ "$(stat -c %u gonogo-data)" = 1000 ]
          # published on every interface
          docker compose port gonogo 7777 | tee port.txt
          grep -q '^0.0.0.0:7777$' port.txt
          # the server (uid 1000, not root) reaches the Docker socket: the image added its group
          docker compose exec gonogo sh -c 'gonogo-drop docker version --format "{{.Server.Version}}"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: 127.0.0.1:7777' http://127.0.0.1:7777/)
          [[ "$code" =~ ^(200|30[1-8])$ ]] || { echo "::error::127.0.0.1 got $code"; exit 1; }
          # reachable by the machine's own address, with nothing allowed: an IP literal needs no configuration (a name does)
          ip=$(hostname -I | awk '{print $1}')
          echo "this machine: $ip"
          viaip=$(curl -s -o /dev/null -w '%{http_code}' "http://$ip:7777/")
          [[ "$viaip" =~ ^(200|30[1-8])$ ]] || { echo "::error::http://$ip:7777/ got $viaip"; exit 1; }
          name=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: other.test:7777' "http://$ip:7777/")
          [ "$name" = 403 ] || { echo "::error::a name nobody allowed got $name, not 403"; exit 1; }
          # the data folder is said in the log, and warned about when it is the new empty default
          docker compose logs gonogo | grep -q 'gonogo: data folder .* is new and empty (the default'
      - if: always()
        run: |
          cd "$RUNNER_TEMP/zero" 2>/dev/null && docker compose logs --tail 40 || true
          cd "$RUNNER_TEMP/zero" 2>/dev/null && docker compose down -v --timeout 20 || true

  # Homebrew
  formula:
    needs: changes
    if: ${{ needs.changes.outputs.brew == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Put brew on the PATH (Linux)
        if: runner.os == 'Linux'
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      # No version: it installs the pnpm that package.json `packageManager` pins.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # `prepack` builds the client and the server; the tarball is the file the release workflow attaches to the release
      - name: Pack the tarball
        run: |
          mkdir "$RUNNER_TEMP/asset"
          pnpm pack --pack-destination "$RUNNER_TEMP/asset"
          ls -l "$RUNNER_TEMP/asset"
      - name: Make a local tap with the formula
        run: |
          set -eu
          brew --version
          set -- "$RUNNER_TEMP"/asset/*.tgz
          [ "$#" = 1 ] && [ -f "$1" ] || { echo "::error::expected one tarball"; exit 1; }
          tarball=$1
          version=$(node -p 'require("./package.json").version')
          sha=$(shasum -a 256 "$tarball" | cut -d' ' -f1)
          brew tap-new --no-git ulm0/ci
          formulas="$(brew --repository ulm0/ci)/Formula"
          mkdir -p "$formulas"
          # the install copy: the tarball of this checkout, from a file
          sed -e "s|^  url .*|  url \"file://$tarball\"|" -e "s|^  sha256 .*|  sha256 \"$sha\"|" packaging/homebrew/gonogo.rb > "$formulas/gonogo.rb"
          # the audit copy: the release-asset url the real tap carries
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/$(basename "$tarball")"
          mkdir -p "$RUNNER_TEMP/audit"
          sed -e "s|^  url .*|  url \"$url\"|" -e "s|^  sha256 .*|  sha256 \"$sha\"|" packaging/homebrew/gonogo.rb > "$RUNNER_TEMP/audit/gonogo.rb"
          grep -E '^  (url|sha256)' "$formulas/gonogo.rb"
      - name: brew install --build-from-source
        run: brew install --build-from-source --verbose ulm0/ci/gonogo
      - name: brew test
        run: brew test --verbose ulm0/ci/gonogo
      - name: The terminal helper of node-pty is executable
        run: |
          set -eu
          prefix=$(brew --prefix ulm0/ci/gonogo)
          echo "gonogo --version: $("$prefix/bin/gonogo" --version)"
          libexec=$(brew --prefix ulm0/ci/gonogo)/libexec
          # the prebuilt native part of THIS platform: macOS ships spawn-helper next to pty.node and cannot start a terminal without it executable
          found=$(find -L "$libexec" -path '*node-pty-*/prebuilds/*' -name 'spawn-helper' 2>/dev/null | head -5)
          if [ "$RUNNER_OS" = macOS ]; then
            [ -n "$found" ] || { echo "::error::no spawn-helper found under $libexec: the prebuilt node-pty of macOS is missing"; exit 1; }
          fi
          for f in $found; do
            if [ -x "$f" ]; then echo "ok, executable: $f"; else echo "::error::$f is not executable"; ls -l "$f"; exit 1; fi
          done
          [ -z "$found" ] && echo "no spawn-helper on this platform (Linux has none): nothing to check"
          pty=$(find -L "$libexec" -path '*node-pty-*/prebuilds/*' -name 'pty.node' | head -1)
          [ -n "$pty" ] || { echo "::error::the prebuilt pty.node is missing under $libexec"; exit 1; }
          echo "pty.node: $pty"
      - name: brew audit --strict --formula
        run: |
          set -eu
          # an audit of a formula by path is refused too: it goes in the tap first, with the release-asset url
          cp "$RUNNER_TEMP/audit/gonogo.rb" "$(brew --repository ulm0/ci)/Formula/gonogo.rb"
          # each problem is also an annotation of the run (the log of a run is not readable without a login)
          if ! out=$(brew audit --strict --formula ulm0/ci/gonogo 2>&1); then
            echo "$out"
            printf '%s\n' "$out" | while IFS= read -r line; do [ -n "$line" ] && echo "::error::audit: $line"; done
            exit 1
          fi
          echo "$out"
