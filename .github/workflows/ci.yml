name: CI

# check and changelog gate every pull request and push to main. Two reports run weekly and by hand (Run workflow, pick one); they block nothing:
# - flaky (flaky.yml through 0.22): the e2e suite ten times in a row on a clean runner; the job summary lists every test that failed in at least
#   one run, with how many of the runs. A flaky test passes alone and fails sometimes; this finds them before a release does.
# - bench (knowledge-bench.yml through 0.22): the anchor engine on big repositories (scripts/knowledge-bench.mjs): a repository of 100,000
#   tracked files is refused at once, one just under the 20,000-file cap is checked, a pattern that never ends is ended at 5 s, a file list over
#   the cap reads "could not check", 20 runs at once never have more than 2 workers, and the RSS stays bounded. The numbers are in the summary.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      report:
        description: Which report to run
        type: choice
        options: [flaky, bench]
        default: flaky
      runs:
        description: "flaky: how many times to run the e2e suite (1 to 20)"
        default: '10'
        type: string
      files:
        description: "bench: tracked files of the big repository (100 to 1000000)"
        default: '100000'
        type: string

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No version: it installs the pnpm that package.json `packageManager` pins.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The lowest Node that `engines` allows, and the Node of the Docker image.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec vitest run
      - run: pnpm build
      - run: pnpm check:pack
      # Does `gonogo knowledge export --multivac` read as multivac's own file? A pinned multivac with locked dependencies (multivac-conformance.yml
      # through 0.22): about half a minute.
      - run: node scripts/multivac-conformance.mjs
      # The site is published on a release, so a broken page is caught here, on the pull request.
      - run: pnpm docs:build

  # CHANGELOG.md is changed only by the release pull request (it also changes the version); everyone else adds changes/<branch>.md.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE...HEAD" | grep -qx CHANGELOG.md; then
            before=$(git show "origin/$BASE:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
            after=$(node -p 'require("./package.json").version')
            if [ "$before" = "$after" ]; then
              echo "::error file=CHANGELOG.md::Do not edit CHANGELOG.md in a pull request (it conflicts with every other one). Add changes/<branch>.md instead; see changes/README.md."
              exit 1
            fi
          fi

  flaky:
    if: github.event_name == 'schedule' || inputs.report == 'flaky'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No version: it installs the pnpm that package.json `packageManager` pins.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the e2e suite and collect the failures
        env:
          RUNS: ${{ inputs.runs || '10' }}
        run: |
          # the input is text from whoever dispatches: a number from 1 to 20, or the job stops (a run is about 3 min, the job limit is 120)
          if ! [[ "$RUNS" =~ ^[0-9]+$ ]] || [ "$RUNS" -lt 1 ] || [ "$RUNS" -gt 20 ]; then
            echo "::error::runs must be a number from 1 to 20, got: $RUNS"
            exit 1
          fi
          mkdir -p flaky
          for i in $(seq 1 "$RUNS"); do
            # a failed run is the point, not an error: the report below says what failed
            pnpm exec vitest run test/e2e.test.ts --reporter=json --outputFile="flaky/run-$i.json" || true
          done
          node -e '
            const fs = require("node:fs");
            const failed = new Map();
            let runs = 0;
            for (const f of fs.readdirSync("flaky").filter((n) => n.endsWith(".json"))) {
              let json;
              try { json = JSON.parse(fs.readFileSync(`flaky/${f}`, "utf8")); } catch { continue; }
              runs += 1;
              for (const file of json.testResults ?? []) {
                for (const t of file.assertionResults ?? []) {
                  if (t.status === "failed") failed.set(t.fullName, (failed.get(t.fullName) ?? 0) + 1);
                }
              }
            }
            const lines = [`## Flake detector: ${runs} runs of test/e2e.test.ts`, ""];
            if (runs === 0) lines.push("**No run produced a report: the suite did not start.**");
            else if (failed.size === 0) lines.push("No test failed in any run.");
            else {
              lines.push("| failed in | test |", "|---|---|");
              for (const [name, n] of [...failed].sort((a, b) => b[1] - a[1])) lines.push(`| ${n} of ${runs} | ${name.replace(/\|/g, "\\|")} |`);
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            console.log(lines.join("\n"));
            // a suite that did not start at all is the one thing worth a red job
            if (runs === 0) process.exit(1);
          '
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-reports
          path: flaky/
          retention-days: 30

  bench:
    if: github.event_name == 'schedule' || inputs.report == 'bench'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:server
      - env:
          FILES: ${{ inputs.files || '100000' }}
        run: node scripts/knowledge-bench.mjs --files "$FILES"
