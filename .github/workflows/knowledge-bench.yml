name: Knowledge bench

# The anchor engine on big repositories (scripts/knowledge-bench.mjs): a repository of 100,000 tracked files is refused at once, one just under the
# 20,000-file cap is checked, a pattern that never ends is ended at 5 s, a file list over the cap reads "could not check", 20 runs at once never have
# more than 2 workers, and the RSS stays bounded. By hand (Run workflow) and weekly; not a gate for pull requests. The numbers are in the run's summary.
on:
  workflow_dispatch:
    inputs:
      files:
        description: Tracked files of the big repository (100 to 1000000)
        default: '100000'
  schedule:
    - cron: '17 4 * * 1'

permissions: {}

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:server
      - env:
          FILES: ${{ inputs.files || '100000' }}
        run: node scripts/knowledge-bench.mjs --files "$FILES"
