name: Release

# Publishes the npm package for a v* tag, with provenance, then creates or updates the tag's GitHub Release.
# A pushed v* tag runs it; so does a run by hand ("Run workflow") with the name of a tag that already exists.
# It checks out that tag, runs the full checks, refuses a tag that is not "v" + package.json `version` and a package
# name that is not @<repository owner>/gonogo, then publishes. A version with a pre-release suffix (1.2.0-rc.1) gets the
# npm dist-tag `next` and a GitHub pre-release; any other gets `latest`.
#
# Auth: npm trusted publishing (OIDC). npmjs.com trusts this repository's release.yml for @ulm0/gonogo, so the publish
# job's `id-token: write` is the whole credential: no token lives in the repository. pnpm hands the tarball to the npm
# CLI of Node 24, which must be 11.5.1 or newer for OIDC (checked below).
#
# One tarball: `pnpm pack` makes it once, `pnpm publish <tarball>` publishes that file to npm (with provenance), the same file is attached to the
# GitHub Release, and the Homebrew formula installs from it.
# Verify: the job `verify` runs after the publish and the release's tarball and replaces the by-hand check: npm's sha1 must be the sha1 of the
# release's own tarball (a pack rebuilt from the tag if the release has none), and npm must hold a provenance attestation. `clean-install` then
# installs the version in a clean node:24 container (pinned by digest; Renovate bumps it) and checks that `gonogo --version` is the tag. Both wait
# for npm to serve the version, up to 20 minutes (it took longer than ten for 0.7.0 and 0.8.1).
#
# Homebrew: the tarball that `pnpm pack` makes is attached to the GitHub Release, and the job `homebrew` opens a pull request on the
# tap ulm0/homebrew-tap with the url of THAT asset and its sha256, computed here from the very file that was uploaded. Nothing waits for
# npm's CDN to serve the version it just accepted (it took longer than ten minutes for 0.7.0 and 0.8.1). It is off until the repository
# variable HOMEBREW_TAP is `true` and the secret HOMEBREW_TAP_TOKEN exists (a fine-grained token with Contents and Pull requests write
# on the tap repository only). A pre-release is skipped.
#
# Before the publish, ci.yml is called twice on the tag: run: smoke (the Chromium pass; a failure blocks the publish) and run: brew (the formula
# installed, tested and audited on macOS and Linux; it reports, it does not block).
#
# Docs: the site (https://gonogo.ulm0.com/, GitHub Pages, source "GitHub Actions") is built from the tag and deployed, whether or not the publish
# succeeds, so it shows what is released, not what is on main. The github-pages environment accepts main and v* tags. To publish a docs-only
# fix: Run workflow on main with docs_only and, as tag, the tag or branch to build; then nothing else runs.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to publish, for example v0.2.0 (with docs_only, the tag or branch to build the docs from)
        required: true
        type: string
      docs_only:
        description: Only build and deploy the docs site
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # A real-browser pass of the tagged code first: a failure blocks the publish (the tag, also on a run by hand, where github.ref is a branch).
  smoke:
    if: ${{ !inputs.docs_only }}
    uses: ./.github/workflows/ci.yml
    with:
      run: smoke
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
    permissions:
      contents: read

  # The Homebrew formula from the tagged code, on macOS and Linux. Nothing waits for it.
  formula:
    if: ${{ !inputs.docs_only }}
    uses: ./.github/workflows/ci.yml
    with:
      run: brew
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
    permissions:
      contents: read

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC) and provenance
    steps:
      - name: Check the tag name
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a v<major>.<minor>.<patch> tag"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Check the tag against package.json
        env:
          EXPECTED_NAME: '@${{ github.repository_owner }}/gonogo'
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
          if [ "$name" != "$EXPECTED_NAME" ]; then
            echo "::error::package.json name is $name at $TAG, expected $EXPECTED_NAME"
            exit 1
          fi
      # No version: it installs the pnpm that package.json `packageManager` pins.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No dependency cache in a job that publishes: a poisoned cache must not reach the registry.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec vitest run
      - run: pnpm build
      - run: pnpm check:pack
      - name: Check the npm CLI supports trusted publishing
        run: |
          v=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -1)" != 11.5.1 ]; then
            echo "::error::npm $v is older than 11.5.1, which trusted publishing (OIDC) needs"
            exit 1
          fi
      # The tarball: made here, from the checked tag, published to npm below and carried to the GitHub Release (and Homebrew) by artifact.
      - name: Pack the tarball
        run: |
          mkdir "$RUNNER_TEMP/asset"
          pnpm pack --pack-destination "$RUNNER_TEMP/asset"
          ls -l "$RUNNER_TEMP/asset"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: ${{ runner.temp }}/asset/*.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Publish to npm
        run: |
          name=$(node -p 'require("./package.json").name')
          # A re-run for a version npm already has skips the publish, so the release below can still be updated.
          if [ -n "$(pnpm view "$name@${TAG#v}" version 2>/dev/null)" ]; then
            echo "$name@${TAG#v} is on npm already, not publishing it again"
            exit 0
          fi
          dist_tag=latest
          if [[ "$TAG" == *-* ]]; then dist_tag=next; fi
          # the file packed above, not a pack of its own: npm, the release asset and Homebrew carry ONE tarball (same bytes, same sha256)
          set -- "$RUNNER_TEMP"/asset/*.tgz
          [ "$#" = 1 ] && [ -f "$1" ] || { echo "::error::expected one packed tarball"; exit 1; }
          pnpm publish "$1" --access public --provenance --no-git-checks --tag "$dist_tag"

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: ${{ runner.temp }}/asset
      # The notes are the tag's own section of CHANGELOG.md ("## <version> ..." up to the next "## "); without one,
      # GitHub's generated notes. A release that exists already is updated, so a re-run (or a fixed changelog on a
      # re-pushed tag) refreshes it.
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${TAG#v}
          notes=$(awk -v v="$version" '$0 ~ "^## " { if (on) exit; on = ($2 == v) ; next } on' CHANGELOG.md)
          prerelease=false
          if [[ "$TAG" == *-* ]]; then prerelease=true; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ -n "$notes" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "$notes" --prerelease="$prerelease"
            else
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --prerelease="$prerelease"
            fi
            echo "Updated the release $TAG"
          elif [ -n "$notes" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes "$notes" --prerelease="$prerelease"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes --prerelease="$prerelease"
          fi
      # The npm tarball as the release's own asset: the Homebrew formula installs from it. --clobber: a re-run replaces it.
      - name: Attach the tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -- "$RUNNER_TEMP"/asset/*.tgz
          [ "$#" = 1 ] && [ -f "$1" ] || { echo "::error::expected one tarball in the artifact"; exit 1; }
          gh release upload "$TAG" "$1" --repo "$GITHUB_REPOSITORY" --clobber

  verify:
    needs: [publish, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The tarball the release carries is the one that was published (publish packs once; github-release uploads that file).
      - name: Download the release's tarball
        id: asset
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/asset"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --dir "$RUNNER_TEMP/asset"
          ls "$RUNNER_TEMP/asset"
      # Only if the release has no tarball (a release older than the asset): rebuild it from the tag. The pack is reproducible.
      - if: steps.asset.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - if: steps.asset.outcome == 'failure'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.asset.outcome == 'failure'
        run: |
          echo "::warning::$TAG has no tarball asset: comparing with a pack rebuilt from the tag"
          pnpm install --frozen-lockfile
          pnpm pack --pack-destination "$RUNNER_TEMP/asset"
      - name: npm serves that tarball, with provenance
        run: |
          name="@${GITHUB_REPOSITORY_OWNER}/gonogo"
          version=${TAG#v}
          set -- "$RUNNER_TEMP"/asset/*.tgz
          [ "$#" = 1 ] && [ -f "$1" ] || { echo "::error::expected one tarball in $RUNNER_TEMP/asset"; exit 1; }
          have=$(sha1sum "$1" | cut -d' ' -f1)
          # npm can take a while to serve a version it just accepted
          served=
          for i in $(seq 1 40); do
            served=$(npm view "$name@$version" dist.shasum 2>/dev/null || true)
            [ -n "$served" ] && break
            echo "npm does not serve $name@$version yet ($i of 40)"
            sleep 30
          done
          [ -n "$served" ] || { echo "::error::npm did not serve $name@$version within 20 minutes"; exit 1; }
          echo "release asset $have, npm $served"
          [ "$have" = "$served" ] || { echo "::error::npm's sha1 $served is not the release asset's ($have)"; exit 1; }
          predicate=$(npm view "$name@$version" dist.attestations.provenance.predicateType 2>/dev/null || true)
          echo "provenance: $predicate"
          [ -n "$predicate" ] || { echo "::error::$name@$version has no provenance attestation on npm"; exit 1; }

  # A clean machine: nothing of the repository, only the registry. The image is pinned by digest; Renovate bumps it.
  clean-install:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {}
    container: node:24@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    defaults:
      run:
        shell: bash
    steps:
      - run: |
          version=${TAG#v}
          for i in $(seq 1 40); do
            npm install -g "@${GITHUB_REPOSITORY_OWNER}/gonogo@$version" && break
            echo "install failed ($i of 40), retrying"
            sleep 30
          done
          got=$(gonogo --version | head -n1)
          echo "$got"
          [ "$got" = "gonogo $version" ] || { echo "::error::gonogo --version printed '$got', expected 'gonogo $version'"; exit 1; }

  homebrew:
    needs: github-release
    if: ${{ vars.HOMEBREW_TAP == 'true' && !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: ${{ runner.temp }}/asset
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Update the formula and open the pull request
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version=${TAG#v}
          set -- "$RUNNER_TEMP"/asset/*.tgz
          [ "$#" = 1 ] && [ -f "$1" ] || { echo "::error::expected one tarball in the artifact"; exit 1; }
          file=$1
          # the url of the release asset the previous job attached, and the sha256 of the very file that was uploaded: nothing here waits for npm
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$file")"
          sha=$(sha256sum "$file" | cut -d' ' -f1)
          # the asset is served from GitHub's own storage, within seconds of its upload: a minute is plenty, and a mismatch is an error
          for i in $(seq 1 6); do
            curl -fsSL "$url" -o served.tgz && break
            [ "$i" = 6 ] && { echo "::error::$url is not served"; exit 1; }
            sleep 10
          done
          [ "$(sha256sum served.tgz | cut -d' ' -f1)" = "$sha" ] || { echo "::error::$url serves another file than the one uploaded"; exit 1; }
          mkdir -p tap/Formula
          sed -e "s|^  url .*|  url \"$url\"|" -e "s|^  sha256 .*|  sha256 \"$sha\"|" packaging/homebrew/gonogo.rb > tap/Formula/gonogo.rb
          cd tap
          if git diff --quiet -- Formula/gonogo.rb && [ -z "$(git ls-files --others --exclude-standard Formula/gonogo.rb)" ]; then
            echo "the tap has $version already"
            exit 0
          fi
          branch="gonogo-$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add Formula/gonogo.rb
          git commit -m "gonogo $version"
          git push --force origin "$branch"
          gh pr create --title "gonogo $version" --body "From the release workflow of $GITHUB_REPOSITORY, tag $TAG." --head "$branch" || echo "the pull request exists already"

  # The docs site, from the tag (or, with docs_only, the ref given)
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      # No version: it installs the pnpm that package.json `packageManager` pins.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # no dependency cache: the ref may be any branch, and a cache saved from it would be restored on the default branch (cache poisoning)
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .vitepress/dist

  docs-deploy:
    needs: docs
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # What a link preview reads (og: and twitter: tags, the canonical link, og.png) on the site as it is now served.
  docs-verify:
    needs: docs-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The tags must name the public site, whatever address the deploy reports (a wrong custom domain would otherwise pass).
      - run: node scripts/check-docs-site.mjs "$PAGE_URL" https://gonogo.ulm0.com
        env:
          PAGE_URL: ${{ needs.docs-deploy.outputs.page_url }}
