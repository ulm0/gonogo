name: Docs

# Builds the VitePress site from docs/ and publishes it to GitHub Pages (https://gonogo.ulm0.com/).
# The repository's Pages source must be set to "GitHub Actions".
#
# The site shows what is released, not what is on main: it is built from the v* tag when one is pushed (the same push that runs
# release.yml; a release that fails to publish still leaves its docs up, rerun or fix and tag again). To publish a docs-only fix
# on purpose, run it by hand ("Run workflow") with a ref: a tag, or a branch. The ref is empty by default and then means the
# newest release tag (not a pre-release). CI (ci.yml) still builds the docs on every pull request, so broken docs are caught early.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch to build, for example v0.2.0 (empty means the newest v* release tag)
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Pick what to build
        id: pick
        env:
          INPUT_REF: ${{ inputs.ref }}
          REPO: ${{ github.repository }}
        run: |
          ref="${INPUT_REF:-${GITHUB_REF_NAME}}"
          if [ -z "$INPUT_REF" ] && [ "$GITHUB_REF_TYPE" != tag ]; then
            ref=$(git ls-remote --tags --refs --sort=-v:refname "https://github.com/$REPO" 'v*' | sed 's#.*refs/tags/##' | grep -v '[-]' | head -n1)
            [ -n "$ref" ] || { echo "::error::no v* release tag to build the docs from"; exit 1; }
          fi
          echo "Building the docs from $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pick.outputs.ref }}
          persist-credentials: false
      # No version: it installs the pnpm that package.json `packageManager` pins.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # no dependency cache: the ref may be any branch, and a cache saved from it would be restored on the default branch (cache poisoning)
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # What a link preview reads (og: and twitter: tags, the canonical link, og.png) on the site as it is now served.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The tags must name the public site, whatever address the deploy reports (a wrong custom domain would otherwise pass).
      - run: node scripts/check-docs-site.mjs "$PAGE_URL" https://gonogo.ulm0.com
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
