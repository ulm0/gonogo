# gonogo through Tailscale Serve (your tailnet only) or Funnel (public). Needs Docker Compose v2.23 or later (it uses `configs` with inline `content`, so only this file and compose.yaml are needed).
# On top of compose.yaml (docs/expose/tailscale.md):
#   docker compose -f compose.yaml -f compose.tailscale.yaml up -d
# FIRST set the login up, with compose.yaml alone (open gonogo on this machine, make the account, turn on the second factor): gonogo refuses to start on a
# public name before it, and with restart: always it would loop. Then add this file.
# .env (no secret is written in this file):
#   TS_AUTHKEY=tskey-auth-...          an auth key from the Tailscale admin console
#   TAILSCALE_VERSION=v1.x.y           optional: another tag of tailscale/tailscale (the file pins v1.104.4)
#   TAILSCALE_FUNNEL=true              optional: Funnel (the public internet) instead of Serve (your tailnet only, the default)
#   GONOGO_PUBLIC_NAME=...             the public name (this is also what gonogo accepts as its Host)
#   GONOGO_LAN_HOSTS=zimaos,192.168.1.5   optional: the names you also open gonogo by on your own network, comma separated (kept in GONOGO_ALLOWED_HOSTS)
#   GONOGO_HOOKS_ONLY=1                optional: the public name serves only /uplink and /dock (name:hooks), no page
#   GONOGO_EDGE_SUBNET / GONOGO_EDGE_PROXY_IP   optional: the private network between the sidecar and gonogo (default 172.29.80.0/24 and .2);
#                                      change both if Docker says "Pool overlaps with other one on this address space"
# Tailscale does not decrypt the traffic (the TLS ends in the sidecar, inside your own host).
services:
  tailscale:
    image: tailscale/tailscale:${TAILSCALE_VERSION:-v1.104.4}
    restart: always
    hostname: ${TS_HOSTNAME:-gonogo}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_HOSTNAME: ${TS_HOSTNAME:-gonogo}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      # the node key lives here: a named volume, not the data folder that gonogo's agents can read (docs/expose/tailscale.md)
      - tailscale_state:/var/lib/tailscale
    configs:
      - source: tailscale_serve
        target: /config/serve.json
    networks:
      edge:
        ipv4_address: ${GONOGO_EDGE_PROXY_IP:-172.29.80.2}
  gonogo:
    environment:
      GONOGO_ALLOWED_HOSTS: ${GONOGO_PUBLIC_NAME:?set GONOGO_PUBLIC_NAME}${GONOGO_HOOKS_ONLY:+:hooks},${GONOGO_LAN_HOSTS:-}
      GONOGO_PUBLIC_URL: https://${GONOGO_PUBLIC_NAME:?set GONOGO_PUBLIC_NAME}
      # the sidecar's address on the edge network, not 127.0.0.1: that is how gonogo knows whose forwarded address to believe
      GONOGO_TRUSTED_PROXY: ${GONOGO_EDGE_PROXY_IP:-172.29.80.2}
      GONOGO_CLIENT_IP_HEADER: x-forwarded-for
    networks:
      - default
      - edge
configs:
  tailscale_serve:
    # `$$` keeps Compose from reading it: Tailscale itself fills in TS_CERT_DOMAIN
    content: |
      {
        "TCP": { "443": { "HTTPS": true } },
        "Web": { "$${TS_CERT_DOMAIN}:443": { "Handlers": { "/": { "Proxy": "http://gonogo:7777" } } } },
        "AllowFunnel": { "$${TS_CERT_DOMAIN}:443": ${TAILSCALE_FUNNEL:-false} }
      }
volumes:
  tailscale_state:
networks:
  edge:
    ipam:
      config:
        - subnet: ${GONOGO_EDGE_SUBNET:-172.29.80.0/24}
